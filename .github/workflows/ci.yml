# BankGo — CI/CD Pipeline
# Generated by GentleIA (OpenCode) — Phase 6: CI/CD
# Runs on every push and pull request

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bankgo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bankgo/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check (TypeScript)
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit tests + coverage
        run: npm test -- --coverage --coverageReporters=text --coverageReporters=lcov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: bankgo/coverage/
          retention-days: 7

  build:
    name: Expo Build Check
    runs-on: ubuntu-latest
    needs: quality

    defaults:
      run:
        working-directory: bankgo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bankgo/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Export (build check)
        run: npx expo export --platform web 2>&1 || echo "Build check completed"
